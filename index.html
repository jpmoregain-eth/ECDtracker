<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECD Tracker - POE2 Currency</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #ffd700;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
        }
        .header p {
            color: #888;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: 2px solid #333;
            background: #1a1a1a;
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        .btn:hover {
            border-color: #666;
            background: #222;
        }
        .btn.active {
            border-color: #ffd700;
            background: #2a2a1a;
            color: #ffd700;
        }
        .btn.exalt { border-color: #4ecdc4; }
        .btn.exalt.active { border-color: #4ecdc4; color: #4ecdc4; background: #1a2a2a; }
        .btn.chaos { border-color: #ff6b6b; }
        .btn.chaos.active { border-color: #ff6b6b; color: #ff6b6b; background: #2a1a1a; }
        .chart-container {
            max-width: 1200px;
            margin: 0 auto 40px;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }
        .chart-title {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #ffd700;
        }
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .stat-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            text-align: center;
        }
        .stat-label {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }
        .stat-change {
            font-size: 0.9em;
            margin-top: 5px;
        }
        .up { color: #00ff88; }
        .down { color: #ff4444; }
        .last-update {
            text-align: center;
            color: #666;
            margin-top: 30px;
            font-size: 0.9em;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💎 ECD Tracker</h1>
        <p>Path of Exile 2 - Runes of Aldur League</p>
        <p>Select baseline currency to view pair charts</p>
    </div>

    <div class="controls">
        <button class="btn divine active" onclick="setBaseline('Divine')">Divine Orb</button>
        <button class="btn exalt" onclick="setBaseline('Exalt')">Exalted Orb</button>
        <button class="btn chaos" onclick="setBaseline('Chaos')">Chaos Orb</button>
    </div>

    <div id="charts-container">
        <div class="loading">Loading data...</div>
    </div>

    <div class="stats" id="stats-container">
        <!-- Stats will be populated here -->
    </div>

    <div class="last-update" id="last-update">Last updated: --</div>

    <script>
        // Currency colors
        const colors = {
            Divine: '#ffd700',
            Exalt: '#4ecdc4',
            Chaos: '#ff6b6b',
            Annulment: '#95e1d3'
        };

        let currentBaseline = 'Divine';
        let chartInstances = [];
        let priceData = {};

        // Simulated data - in production this fetches from your API/DB
        function generateMockData() {
            const now = Date.now();
            const hours = 48;
            const points = hours * 4; // Every 15 minutes
            
            const data = {
                Divine: [],
                Exalt: [],
                Chaos: [],
                Annulment: []
            };
            
            for (let i = 0; i < points; i++) {
                const time = now - (points - i) * 15 * 60 * 1000;
                const progress = i / points;
                
                // Simulate realistic price movements
                data.Divine.push({
                    x: new Date(time).toISOString(),
                    y: 100 + Math.sin(progress * Math.PI * 2) * 10 + (Math.random() - 0.5) * 5
                });
                
                data.Exalt.push({
                    x: new Date(time).toISOString(),
                    y: 1 + Math.sin(progress * Math.PI * 2 + 1) * 0.1 + (Math.random() - 0.5) * 0.05
                });
                
                data.Chaos.push({
                    x: new Date(time).toISOString(),
                    y: 9 + Math.sin(progress * Math.PI * 2 + 2) * 2 + (Math.random() - 0.5) * 1
                });
                
                data.Annulment.push({
                    x: new Date(time).toISOString(),
                    y: 2 + Math.sin(progress * Math.PI * 2 + 3) * 0.5 + (Math.random() - 0.5) * 0.2
                });
            }
            
            return data;
        }

        function calculatePair(data, base, quote) {
            const baseData = data[base];
            const quoteData = data[quote];
            
            return baseData.map((point, i) => ({
                x: point.x,
                y: point.y / quoteData[i].y
            }));
        }

        function createChart(containerId, label, data, color) {
            const ctx = document.getElementById(containerId).getContext('2d');
            
            return new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: label,
                        data: data,
                        borderColor: color,
                        backgroundColor: color + '20',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { color: '#e0e0e0' }
                        },
                        tooltip: {
                            backgroundColor: '#1a1a1a',
                            titleColor: '#ffd700',
                            bodyColor: '#e0e0e0',
                            borderColor: '#333',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'hour',
                                displayFormats: {
                                    hour: 'MMM dd HH:mm'
                                }
                            },
                            grid: { color: '#333' },
                            ticks: { color: '#888' }
                        },
                        y: {
                            grid: { color: '#333' },
                            ticks: { color: '#888' }
                        }
                    }
                }
            });
        }

        function updateStats(data, baseline) {
            const container = document.getElementById('stats-container');
            const others = Object.keys(data).filter(k => k !== baseline && k !== 'Annulment');
            
            let html = '';
            others.forEach(currency => {
                const pairData = calculatePair(data, baseline, currency);
                const current = pairData[pairData.length - 1].y;
                const previous = pairData[pairData.length - 2].y;
                const change = ((current - previous) / previous) * 100;
                const changeClass = change > 0 ? 'up' : change < 0 ? 'down' : '';
                const arrow = change > 0 ? '▲' : change < 0 ? '▼' : '→';
                
                html += `
                    <div class="stat-card">
                        <div class="stat-label">${baseline} / ${currency}</div>
                        <div class="stat-value" style="color: ${colors[currency]}">${current.toFixed(4)}</div>
                        <div class="stat-change ${changeClass}">${arrow} ${Math.abs(change).toFixed(2)}%</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function renderCharts() {
            // Clear existing charts
            chartInstances.forEach(chart => chart.destroy());
            chartInstances = [];
            
            const container = document.getElementById('charts-container');
            const data = priceData;
            const others = Object.keys(data).filter(k => k !== currentBaseline && k !== 'Annulment');
            
            let html = '';
            others.forEach((currency, index) => {
                html += `
                    <div class="chart-container">
                        <div class="chart-title">${currentBaseline} / ${currency}</div>
                        <div class="chart-wrapper">
                            <canvas id="chart-${index}"></canvas>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            others.forEach((currency, index) => {
                const pairData = calculatePair(data, currentBaseline, currency);
                const chart = createChart(
                    `chart-${index}`,
                    `${currentBaseline}/${currency}`,
                    pairData,
                    colors[currency]
                );
                chartInstances.push(chart);
            });
            
            updateStats(data, currentBaseline);
        }

        function setBaseline(baseline) {
            currentBaseline = baseline;
            
            // Update button states
            document.querySelectorAll('.btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.btn.${baseline.toLowerCase()}`).classList.add('active');
            
            renderCharts();
        }

        function init() {
            // Load data (in production, fetch from your API)
            priceData = generateMockData();
            
            renderCharts();
            
            document.getElementById('last-update').textContent = 
                `Last updated: ${new Date().toLocaleString()}`;
            
            // Auto-refresh every 15 minutes
            setInterval(() => {
                // In production: fetch new data and re-render
                priceData = generateMockData();
                renderCharts();
                document.getElementById('last-update').textContent = 
                    `Last updated: ${new Date().toLocaleString()}`;
            }, 900000);
        }

        // Initialize
        init();
    </script>
</body>
</html>
