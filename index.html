<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECD Tracker - POE2 Currency</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #ffd700;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
        }
        .header p {
            color: #888;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: 2px solid #333;
            background: #1a1a1a;
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        .btn:hover {
            border-color: #666;
            background: #222;
        }
        .btn.active {
            border-color: #ffd700;
            background: #2a2a1a;
            color: #ffd700;
        }
        .btn.exalt { border-color: #4ecdc4; }
        .btn.exalt.active { border-color: #4ecdc4; color: #4ecdc4; background: #1a2a2a; }
        .btn.chaos { border-color: #ff6b6b; }
        .btn.chaos.active { border-color: #ff6b6b; color: #ff6b6b; background: #2a1a1a; }
        .chart-container {
            max-width: 1200px;
            margin: 0 auto 40px;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }
        .chart-title {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #ffd700;
        }
        .chart-wrapper {
            position: relative;
            height: 500px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .stat-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            text-align: center;
        }
        .stat-label {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }
        .stat-change {
            font-size: 0.9em;
            margin-top: 5px;
        }
        .up { color: #00ff88; }
        .down { color: #ff4444; }
        .last-update {
            text-align: center;
            color: #666;
            margin-top: 30px;
            font-size: 0.9em;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #ff4444;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }
        .legend-color {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💎 ECD Tracker</h1>
        <p>Path of Exile 2 - Runes of Aldur League</p>
        <p>Select baseline currency to view all pairs in one chart</p>
        <p style="color: #666; font-size: 0.85em; margin-top: 5px;">📊 % Change compares current price vs 24 hours ago</p>
    </div>

    <div class="controls">
        <button class="btn divine active" onclick="setBaseline('Divine')">Divine Orb</button>
        <button class="btn exalt" onclick="setBaseline('Exalt')">Exalted Orb</button>
        <button class="btn chaos" onclick="setBaseline('Chaos')">Chaos Orb</button>
        <button class="btn" style="border-color: #ff9f43; color: #ff9f43;" onclick="setBaseline('Omen_Abyssal_Echoes')">Omen Abyssal</button>
        <button class="btn" style="border-color: #ee5253; color: #ee5253;" onclick="setBaseline('Omen_Whittling')">Omen Whittling</button>
        <button class="btn" style="border-color: #feca57; color: #feca57;" onclick="setBaseline('Omen_Light')">Omen Light</button>
        <button class="btn" style="border-color: #5f27cd; color: #5f27cd;" onclick="setBaseline('Hinekoras_Lock')">Hinekora's Lock</button>
        <button class="btn" style="border-color: #00d2d3; color: #00d2d3;" onclick="setBaseline('Mirror_Kalandra')">Mirror Kalandra</button>
    </div>

    <div class="chart-container">
        <div class="chart-title" id="chart-title">All Currencies vs Divine</div>
        <div class="chart-wrapper">
            <canvas id="main-chart"></canvas>
        </div>
        <div class="legend" id="legend"></div>
    </div>

    <div class="stats" id="stats-container">
        <!-- Stats will be populated here -->
    </div>

    <div class="last-update" id="last-update">Last updated: --</div>

    <script>
        // Currency colors
        const colors = {
            Divine: '#ffd700',
            Exalt: '#4ecdc4',
            Chaos: '#ff6b6b',
            Annulment: '#95e1d3',
            Omen_Abyssal_Echoes: '#ff9f43',
            Omen_Whittling: '#ee5253',
            Omen_Light: '#feca57',
            Hinekoras_Lock: '#5f27cd',
            Mirror_Kalandra: '#00d2d3'
        };

        let currentBaseline = 'Divine';
        let mainChart = null;
        let pairsData = {};

        async function loadData() {
            try {
                const response = await fetch('data/pairs.json');
                if (!response.ok) {
                    throw new Error('Data file not found');
                }
                
                pairsData = await response.json();
                
                renderChart();
                updateStats();
                
                document.getElementById('last-update').textContent = 
                    `Last updated: ${new Date().toLocaleString()}`;
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('chart-title').textContent = 
                    `Error: ${error.message}. Run generate_data.py first`;
            }
        }

        function createMainChart(datasets) {
            const ctx = document.getElementById('main-chart').getContext('2d');
            
            if (mainChart) {
                mainChart.destroy();
            }
            
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: '#1a1a1a',
                            titleColor: '#ffd700',
                            bodyColor: '#e0e0e0',
                            borderColor: '#333',
                            borderWidth: 1,
                            callbacks: {
                                title: function(context) {
                                    const date = new Date(context[0].parsed.x);
                                    return date.toLocaleString();
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'hour',
                                displayFormats: {
                                    hour: 'MMM dd HH:mm'
                                }
                            },
                            grid: { color: '#333' },
                            ticks: { color: '#888' }
                        },
                        y: {
                            grid: { color: '#333' },
                            ticks: { color: '#888' },
                            title: {
                                display: true,
                                text: 'Rate (per 1 Baseline)',
                                color: '#888'
                            }
                        }
                    }
                }
            });
        }

        function renderChart() {
            const others = ['Divine', 'Exalt', 'Chaos', 'Omen_Abyssal_Echoes', 'Omen_Whittling', 'Omen_Light', 'Hinekoras_Lock', 'Mirror_Kalandra'].filter(k => k !== currentBaseline);
            
            const datasets = others.map(currency => {
                const pairKey = `${currentBaseline}/${currency}`;
                const pairData = pairsData[pairKey] || [];
                
                const parsedData = pairData.map(point => ({
                    x: new Date(point.x),
                    y: point.y
                }));
                
                return {
                    label: `${currentBaseline}/${currency}`,
                    data: parsedData,
                    borderColor: colors[currency],
                    backgroundColor: colors[currency] + '10',
                    fill: false,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    borderWidth: 2
                };
            });
            
            createMainChart(datasets);
            
            // Update legend
            const legendHtml = others.map(currency => `
                <div class="legend-item">
                    <div class="legend-color" style="background: ${colors[currency]}"></div>
                    <span>${currentBaseline}/${currency}</span>
                </div>
            `).join('');
            
            document.getElementById('legend').innerHTML = legendHtml;
            document.getElementById('chart-title').textContent = 
                `All Currencies vs ${currentBaseline}`;
        }

        function updateStats() {
            const container = document.getElementById('stats-container');
            const others = ['Divine', 'Exalt', 'Chaos', 'Omen_Abyssal_Echoes', 'Omen_Whittling', 'Omen_Light', 'Hinekoras_Lock', 'Mirror_Kalandra'].filter(k => k !== currentBaseline);
            
            let html = '';
            others.forEach(currency => {
                const pairKey = `${currentBaseline}/${currency}`;
                const pairData = pairsData[pairKey] || [];
                
                if (pairData.length > 0) {
                    const current = pairData[pairData.length - 1].y;
                    // Compare with data from ~24 hours ago (96 data points back at 15-min intervals)
                    const dayAgoIndex = Math.max(0, pairData.length - 97);
                    const previous = pairData[dayAgoIndex].y;
                    const change = ((current - previous) / previous) * 100;
                    const changeClass = change > 0 ? 'up' : change < 0 ? 'down' : '';
                    const arrow = change > 0 ? '▲' : change < 0 ? '▼' : '→';
                    
                    html += `
                        <div class="stat-card">
                            <div class="stat-label">${currentBaseline} / ${currency}</div>
                            <div class="stat-value" style="color: ${colors[currency]}">${current.toFixed(4)}</div>
                            <div class="stat-change ${changeClass}">${arrow} ${Math.abs(change).toFixed(2)}%</div>
                        </div>
                    `;
                }
            });
            
            container.innerHTML = html;
        }

        function setBaseline(baseline) {
            currentBaseline = baseline;
            
            document.querySelectorAll('.btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.btn.${baseline.toLowerCase()}`).classList.add('active');
            
            renderChart();
            updateStats();
        }

        // Initialize
        loadData();
        
        // Auto-refresh every 15 minutes
        setInterval(() => {
            loadData();
        }, 900000);
    </script>
</body>
</html>
